---
layout: default
---

<section class="w sec name">
  <h2 class="lab">Name</h2>
  <div class="body">
    <h1>{{ page.title }}</h1>
    <p class="dash">
      <span class="nm">{{ page.date | date: "%Y-%m-%d" }}</span>
      {% assign cats = page.categories | join: ' ' | replace: ',', '' | split: ' ' | uniq %}
      {% for cat in cats %}<span class="em">&#183;</span><span class="st">{{ cat }}</span>{% endfor %}
    </p>
  </div>
</section>

<article class="post">
  {{ content }}
</article>

<div class="post-foot">
  <a class="back" href="/writing/">&#8592; back to writing</a>
</div>
