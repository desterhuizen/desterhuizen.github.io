---
layout: default
---

<section class="post-header">
  <div class="wrap">
    <p class="eyebrow">Writing / Research</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span>{{ page.date | date: "%d %b %Y" }}</span>
      {% assign cats = page.categories | join: ' ' | replace: ',', '' | split: ' ' | uniq %}
      {% for cat in cats %}<span class="cat">{{ cat }}</span>{% endfor %}
    </div>
  </div>
</section>

<article class="post">
  {{ content }}
</article>

<div class="post-foot">
  <a class="back-link" href="/#writing">← Back to writing</a>
</div>
