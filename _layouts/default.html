<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% if page.title %}<title>{{ page.title }} — {{ site.title }}</title>{% else %}<title>{{ site.title }}</title>{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="shortcut icon" href="/assets/favicon.ico">
<link rel="manifest" href="/assets/site.webmanifest">
<meta name="theme-color" content="#101316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Martian+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v={{ site.time | date: '%s' }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header>
  <div class="w bar">
    <a class="cmd" href="/"><span class="sig" aria-hidden="true">&#10095;</span>man <b>desterhuizen</b></a>
    <nav aria-label="Primary">
      <a href="/#description">DESCRIPTION</a>
      <a href="/#options">OPTIONS</a>
      <a href="/#repositories">REPOSITORIES</a>
      <a href="/#history">HISTORY</a>
      <a href="/#publications">PUBLICATIONS</a>
      <a href="/#experiments">EXPERIMENTS</a>
      <a href="/#author">AUTHOR</a>
    </nav>
    <span class="ref">DESTERHUIZEN(7)</span>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer>
  <div class="w foot">
    <span>desterhuizen.uk</span>
    <span>{{ site.time | date: "%Y-%m-%d" }}</span>
    <span>DESTERHUIZEN(7)</span>
  </div>
</footer>

</body>
</html>
